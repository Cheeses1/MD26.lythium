name: Release Sandy Mission PBO

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  issues: write

jobs:
  build-assets:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $isPrerelease = $tag.ToLower().Contains("rc")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Download pboman3 binaries
        id: pboman
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/winseros/pboman3/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^PBOManager-binaries-.*\.zip$' } | Select-Object -First 1

          if (-not $asset) {
            throw "Could not find a PBOManager binaries zip in the latest release assets."
          }

          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $zipPath = Join-Path $PWD "tools\pboman3.zip"

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath -Headers $headers
          Expand-Archive -Path $zipPath -DestinationPath "tools\pboman3" -Force

          $pboc = Get-ChildItem -Path "tools\pboman3" -Recurse -Filter "pboc.exe" | Select-Object -First 1
          $pbom = Get-ChildItem -Path "tools\pboman3" -Recurse -Filter "pbom.exe" | Select-Object -First 1

          if ($pboc) {
            $exePath = $pboc.FullName
          } elseif ($pbom) {
            $exePath = $pbom.FullName
          } else {
            throw "Neither pboc.exe nor pbom.exe was found in downloaded binaries."
          }

          "exe_path=$exePath" >> $env:GITHUB_OUTPUT

      - name: Ensure CfgConvert is available
        id: cfgconvert
        shell: pwsh
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_GUARD_CODE: ${{ secrets.STEAM_GUARD_CODE }}
        run: |
          $cfgConvertCandidates = @()
          if ($env:CFGCONVERT_EXE) {
            $cfgConvertCandidates += $env:CFGCONVERT_EXE
          }

          if ($env:ProgramFiles) {
            $cfgConvertCandidates += (Join-Path $env:ProgramFiles "Steam\steamapps\common\Arma 3 Tools\CfgConvert\CfgConvert.exe")
          }

          if (${env:ProgramFiles(x86)}) {
            $cfgConvertCandidates += (Join-Path ${env:ProgramFiles(x86)} "Steam\steamapps\common\Arma 3 Tools\CfgConvert\CfgConvert.exe")
          }

          $cfgConvertCandidates += "CfgConvert.exe"

          $cfgConvertExe = $null
          foreach ($candidate in $cfgConvertCandidates) {
            if ($candidate -eq "CfgConvert.exe") {
              $command = Get-Command $candidate -ErrorAction SilentlyContinue
              if ($command) {
                $cfgConvertExe = $command.Source
              }
            } elseif (Test-Path $candidate) {
              $cfgConvertExe = (Resolve-Path $candidate).Path
            }

            if ($cfgConvertExe) {
              break
            }
          }

          if (-not $cfgConvertExe) {
            if ([string]::IsNullOrWhiteSpace($env:STEAM_USERNAME) -or [string]::IsNullOrWhiteSpace($env:STEAM_PASSWORD)) {
              throw "CfgConvert.exe not found and Steam credentials are not configured. Set CFGCONVERT_EXE, or add STEAM_USERNAME/STEAM_PASSWORD secrets to install Arma 3 Tools in CI."
            }

            New-Item -ItemType Directory -Force -Path tools | Out-Null

            $steamCmdZip = Join-Path $PWD "tools\steamcmd.zip"
            $steamCmdDir = Join-Path $PWD "tools\steamcmd"
            $steamCmdExe = Join-Path $steamCmdDir "steamcmd.exe"
            $arma3ToolsDir = Join-Path $PWD "tools\arma3tools"
            $steamLog = Join-Path $PWD "tools\steamcmd-install.log"

            Invoke-WebRequest -Uri "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" -OutFile $steamCmdZip
            Expand-Archive -Path $steamCmdZip -DestinationPath $steamCmdDir -Force

            $steamArgs = @(
              "+@ShutdownOnFailedCommand", "1",
              "+@NoPromptForPassword", "1",
              "+force_install_dir", $arma3ToolsDir,
              "+login", $env:STEAM_USERNAME, $env:STEAM_PASSWORD
            )

            if (-not [string]::IsNullOrWhiteSpace($env:STEAM_GUARD_CODE)) {
              $steamArgs += @("+set_steam_guard_code", $env:STEAM_GUARD_CODE)
            }

            $steamArgs += @(
              "+app_update", "233800", "validate",
              "+quit"
            )

            & "$steamCmdExe" @steamArgs 2>&1 | Tee-Object -FilePath $steamLog
            $steamExitCode = $LASTEXITCODE

            if ($steamExitCode -ne 0) {
              $steamOutput = if (Test-Path $steamLog) { Get-Content -Path $steamLog -Raw } else { "" }

              if ($steamOutput -match "No subscription") {
                throw "Steam account does not own app 233800 (Arma 3 Tools) for this CI context. Add Arma 3 Tools to that account's library first, then retry."
              }

              if ($steamOutput -match "Steam Guard|Two-factor|two factor|Invalid Password|invalid password") {
                throw "Steam authentication failed. Re-check STEAM_USERNAME/STEAM_PASSWORD and provide a valid STEAM_GUARD_CODE if Steam Guard is required."
              }

              throw "Failed to install Arma 3 Tools via SteamCMD (exit code $steamExitCode). Verify Steam credentials/entitlements or set CFGCONVERT_EXE directly."
            }

            $cfgConvertExe = Get-ChildItem -Path $arma3ToolsDir -Recurse -Filter "CfgConvert.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $cfgConvertExe) {
            throw "CfgConvert.exe was not found after installation attempt. Set CFGCONVERT_EXE to a valid path if needed."
          }

          "exe_path=$cfgConvertExe" >> $env:GITHUB_OUTPUT

      - name: Build SandyTrainingMap PBO
        id: build
        shell: pwsh
        run: |
          $missionFolder = Join-Path $PWD "SandyTrainingMap.Lythium"
          if (-not (Test-Path $missionFolder)) {
            throw "Mission folder not found: $missionFolder"
          }

          $missionSqm = Join-Path $missionFolder "mission.sqm"
          if (-not (Test-Path $missionSqm)) {
            throw "mission.sqm not found: $missionSqm"
          }

          $cfgConvertCandidates = @()
          if ("${{ steps.cfgconvert.outputs.exe_path }}") {
            $cfgConvertCandidates += "${{ steps.cfgconvert.outputs.exe_path }}"
          }

          if ($env:CFGCONVERT_EXE) {
            $cfgConvertCandidates += $env:CFGCONVERT_EXE
          }

          if ($env:ProgramFiles) {
            $cfgConvertCandidates += (Join-Path $env:ProgramFiles "Steam\steamapps\common\Arma 3 Tools\CfgConvert\CfgConvert.exe")
          }

          if (${env:ProgramFiles(x86)}) {
            $cfgConvertCandidates += (Join-Path ${env:ProgramFiles(x86)} "Steam\steamapps\common\Arma 3 Tools\CfgConvert\CfgConvert.exe")
          }

          $cfgConvertCandidates += "CfgConvert.exe"

          $cfgConvertExe = $null
          foreach ($candidate in $cfgConvertCandidates) {
            if ($candidate -eq "CfgConvert.exe") {
              $command = Get-Command $candidate -ErrorAction SilentlyContinue
              if ($command) {
                $cfgConvertExe = $command.Source
              }
            } elseif (Test-Path $candidate) {
              $cfgConvertExe = (Resolve-Path $candidate).Path
            }

            if ($cfgConvertExe) {
              break
            }
          }

          if (-not $cfgConvertExe) {
            throw "CfgConvert.exe was not found. Set CFGCONVERT_EXE or install Arma 3 Tools on the runner before packing."
          }

          $binarizedMissionSqm = Join-Path $missionFolder "mission.sqm.bin"

          # Try known CfgConvert invocation styles to maximize compatibility across tool versions.
          & "$cfgConvertExe" -bin -dst "$binarizedMissionSqm" "$missionSqm"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $binarizedMissionSqm)) {
            & "$cfgConvertExe" -bin "$missionSqm" "$binarizedMissionSqm"
          }

          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $binarizedMissionSqm)) {
            throw "Binarization of mission.sqm failed with CfgConvert.exe"
          }

          Move-Item -Path $binarizedMissionSqm -Destination $missionSqm -Force

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $packer = "${{ steps.pboman.outputs.exe_path }}"
          & "$packer" pack "$missionFolder" -o (Join-Path $PWD "dist")
          if ($LASTEXITCODE -ne 0) {
            throw "PBO packing failed with exit code $LASTEXITCODE"
          }

          $pbo = Get-ChildItem -Path "dist" -Filter "*.pbo" | Where-Object { $_.BaseName -eq "SandyTrainingMap.Lythium" } | Select-Object -First 1
          if (-not $pbo) {
            $pbo = Get-ChildItem -Path "dist" -Filter "*.pbo" | Select-Object -First 1
          }
          if (-not $pbo) {
            throw "No PBO file was produced in dist/."
          }

          $releaseAsset = "SandyTrainingMap-${{ steps.version.outputs.tag }}.Lythium.pbo"
          $releasePath = Join-Path $PWD (Join-Path "dist" $releaseAsset)

          Move-Item -Path $pbo.FullName -Destination $releasePath -Force
          "asset_path=$releasePath" >> $env:GITHUB_OUTPUT

      - name: Copy HTML presets to dist
        id: presets
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $htmlFiles = Get-ChildItem -Path $PWD -Filter "*.html" -File
          foreach ($f in $htmlFiles) {
            $dest = Join-Path $PWD "dist" ($f.BaseName + "-" + $tag + $f.Extension)
            Copy-Item -Path $f.FullName -Destination $dest -Force
          }

      - name: Build release body
        id: release_body
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $previousTag = git tag --sort=-creatordate | Where-Object { $_ -ne $tag } | Select-Object -First 1

          $bodyLines = @(
            "## Included Artifacts",
            "",
            "- SandyTrainingMap-$tag.Lythium.pbo",
            "- HTML preset files with -$tag suffix",
            "",
            "## Commit Changes",
            ""
          )

          if ($previousTag) {
            $bodyLines += "From $previousTag to $tag"
            $bodyLines += ""
            $changes = git log --pretty=format:"- %h %s" "$previousTag..$tag"
          } else {
            $bodyLines += "No previous tag found. Showing latest commits."
            $bodyLines += ""
            $changes = git log --pretty=format:"- %h %s" -n 20
          }

          if (-not $changes) {
            $bodyLines += "- No commit changes detected."
          } else {
            $bodyLines += $changes
          }

          Set-Content -Path (Join-Path $PWD "dist\release-body.md") -Value ($bodyLines -join "`r`n") -Encoding UTF8

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

  review-stable:
    if: needs.build-assets.outputs.prerelease != 'true'
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - name: Manual review for stable release
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approve stable release ${{ needs.build-assets.outputs.tag }}"
          issue-body: "Please review the generated artifacts in this workflow run and approve to publish this stable release."

  publish-release:
    if: always() && needs.build-assets.result == 'success' && (needs.review-stable.result == 'success' || needs.review-stable.result == 'skipped')
    needs:
      - build-assets
      - review-stable
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-assets.outputs.tag }}
          name: ${{ needs.build-assets.outputs.tag }}
          prerelease: ${{ needs.build-assets.outputs.prerelease }}
          generate_release_notes: true
          append_body: true
          body_path: dist/release-body.md
          files: dist/*
